<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CodificaWeb</title>
    <style>
      #fragment-codes {
        min-inline-size: 0;
      }
      #category-create {
        display: grid;
        gap: 0.5rem;
      }
      #category-create h3 {
        margin-block: 0.75rem 0;
      }
      #category-create label {
        display: block;
      }
      #category-create :is(input, textarea),
      #category-search {
        max-inline-size: 100%;
      }
      #category-create button {
        justify-self: start;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CodificaWeb</h1>
      <form id="site-access">
        <span id="site-url-field">
          <label for="site-url">URL del sitio</label>
          <input id="site-url" type="url" required />
        </span>
        <button id="verify-site" type="submit">Comprobar acceso</button>
      </form>
      <p id="site-status" role="status"></p>
      <section aria-labelledby="selection-title">
        <h2 id="selection-title">Selección</h2>
        <button id="capture-selection" type="button" disabled>
          Capturar selección
        </button>
        <p id="capture-status" aria-live="polite"></p>
        <blockquote
          id="selection-quote"
          style="white-space: pre-wrap"
        ></blockquote>
        <p id="selection-source"></p>
        <fieldset id="fragment-codes" disabled>
          <legend>Categorías de la cita</legend>
          <label for="category-search">Buscar categorías</label>
          <input id="category-search" type="search" />
          <div id="coding-options"></div>
          <form id="category-create">
            <h3>Nueva categoría</h3>
            <div>
              <label for="category-name">Nombre de la categoría</label>
              <input id="category-name" name="name" maxlength="256" required />
            </div>
            <div>
              <label for="category-color">Color de la categoría</label>
              <input
                id="category-color"
                name="color"
                type="color"
                value="#fdd835"
              />
            </div>
            <div>
              <label for="category-definition"
                >Definición de la categoría (opcional)</label
              >
              <textarea
                id="category-definition"
                name="description"
                maxlength="16384"
              ></textarea>
            </div>
            <button type="submit">Guardar y aplicar</button>
          </form>
        </fieldset>
        <p id="coding-status" aria-live="polite"></p>
        <label for="highlight-filter">Filtrar resaltados por código</label>
        <select id="highlight-filter" disabled>
          <option value="">Todos los códigos</option>
        </select>
        <p id="highlight-status" aria-live="polite"></p>
        <fieldset id="fragment-note" disabled>
          <legend>Nota del fragmento</legend>
          <label for="note-text">Nota en texto plano</label>
          <textarea id="note-text" maxlength="16384"></textarea>
          <button id="note-save" type="button">Guardar nota</button>
          <button id="note-remove" type="button" disabled>Borrar nota</button>
        </fieldset>
        <p id="note-status" aria-live="polite"></p>
      </section>
      <fieldset id="projects" disabled>
        <legend>Proyectos</legend>
        <label for="project-select">Proyecto activo</label>
        <select id="project-select"></select>
        <label for="project-name">Nombre del proyecto</label>
        <input id="project-name" maxlength="256" />
        <label for="project-description">Descripción del proyecto</label>
        <textarea id="project-description" maxlength="16384"></textarea>
        <button id="project-create" type="button">Crear proyecto</button>
        <button id="project-save" type="button">Guardar proyecto</button>
        <button id="project-remove" type="button">Borrar proyecto</button>
        <p id="project-status" aria-live="polite"></p>
      </fieldset>
      <details id="project-transfer">
        <summary>Importar o exportar proyecto</summary>
        <button id="project-export" type="button" disabled>
          Exportar proyecto activo
        </button>
        <label for="project-file">Archivo de proyecto JSON</label>
        <input id="project-file" type="file" accept=".json,application/json" />
        <button id="project-import" type="button" disabled>
          Importar como copia
        </button>
        <p id="transfer-status" aria-live="polite"></p>
      </details>
      <fieldset id="catalog" disabled>
        <legend>Catálogo de códigos</legend>
        <label for="catalog-select">Código del catálogo</label>
        <select id="catalog-select"></select>
        <label for="catalog-name">Nombre del código</label>
        <input id="catalog-name" maxlength="256" />
        <label for="catalog-description">Descripción del código</label>
        <textarea id="catalog-description" maxlength="16384"></textarea>
        <label for="catalog-color">Color del código</label>
        <input id="catalog-color" type="color" value="#fdd835" />
        <button id="catalog-create" type="button">Crear código</button>
        <button id="catalog-save" type="button">Guardar código</button>
        <button id="catalog-remove" type="button">Borrar código</button>
        <p id="catalog-status" aria-live="polite"></p>
      </fieldset>
      <details>
        <summary>Buscar evidencias</summary>
        <form id="evidence-search">
          <fieldset disabled>
            <legend>Filtros del proyecto activo</legend>
            <label for="evidence-text">Texto de la cita o nota</label>
            <input id="evidence-text" type="search" maxlength="16384" />
            <label for="evidence-code">Código de la evidencia</label>
            <select id="evidence-code">
              <option value="">Todos los códigos</option>
            </select>
            <label for="evidence-source">Fuente de la evidencia</label>
            <select id="evidence-source">
              <option value="">Todas las fuentes</option>
            </select>
            <button type="submit">Buscar</button>
          </fieldset>
          <p>
            Incluye citas guardadas aunque su ubicación actual no se pueda
            verificar.
          </p>
          <p id="evidence-status" aria-live="polite"></p>
          <ul id="evidence-results"></ul>
        </form>
      </details>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
